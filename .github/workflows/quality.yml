name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/discovery-security-hardening

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run crawler tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v

  frontend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aggregator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aggregator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate
      - name: Initialize PostgreSQL schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aggregator
        run: npm run db:init
      - name: TypeScript check
        run: npm run typecheck
      - name: Next.js production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aggregator
          STREAM_PROBE_ALLOWED_HOSTS: media.example.org
        run: npm run build
